name: mbid-mapper

services:

  mapper:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - mapper-volume:/data
    restart:
      unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"
    command: ["/mapper/server"]

volumes:
  mapper-volume:
